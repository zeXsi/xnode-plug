services:    

  # frontend в разработку
  frontend:
    build: ./
    container_name: xnode-frontend
    restart: unless-stopped
    networks:
      - proxy-network
    expose:
      - "5020"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=5020

networks:
  proxy-network:
    external: true
